<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Monte Carlo photon random walk in tissue" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="420" height="420" fill="#eef4fb"/>
  <!-- tissue surface -->
  <line x1="40" y1="72" x2="380" y2="72" stroke="#b9d2ec" stroke-width="2" stroke-dasharray="5 6"/>
  <!-- incident beam -->
  <line x1="210" y1="14" x2="210" y2="66" stroke="#305d90" stroke-width="3" stroke-linecap="round"/>
  <polygon points="210,72 204,60 216,60" fill="#305d90"/>
  <!-- random walks -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="210,72 178,128 216,174 168,236 206,300 188,364" stroke="#4178b2" stroke-width="2.6" opacity="0.95"/>
    <polyline points="210,72 252,120 302,160 270,226 322,286 300,352" stroke="#5a92cf" stroke-width="2.4" opacity="0.8"/>
    <polyline points="210,72 158,122 120,178 152,236 112,296" stroke="#6ba0d6" stroke-width="2.2" opacity="0.7"/>
    <polyline points="210,72 238,112 208,82 262,36" stroke="#8fb8e6" stroke-width="2" opacity="0.75"/>
  </g>
  <!-- scatter nodes -->
  <g fill="#4178b2">
    <circle cx="178" cy="128" r="4.5"/><circle cx="216" cy="174" r="4.5"/><circle cx="168" cy="236" r="4.5"/><circle cx="206" cy="300" r="4.5"/>
    <circle cx="252" cy="120" r="4"/><circle cx="302" cy="160" r="4"/><circle cx="270" cy="226" r="4"/><circle cx="322" cy="286" r="4"/>
    <circle cx="158" cy="122" r="4"/><circle cx="120" cy="178" r="4"/><circle cx="152" cy="236" r="4"/>
    <circle cx="238" cy="112" r="3.5"/><circle cx="208" cy="82" r="3.5"/>
  </g>
  <!-- absorption endpoints -->
  <g fill="#305d90">
    <circle cx="188" cy="364" r="6"/><circle cx="300" cy="352" r="6"/><circle cx="112" cy="296" r="6"/>
  </g>
</svg>
